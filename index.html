<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulado MySQL e brModelo</title>
<!-- Bootstrap 5.3.3 (CSS) e fontes -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Source+Sans+3:wght@400;700&display=swap">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<!--CORPO-INICIO-->
<script>
  // aplica o tema salvo antes de desenhar a página (evita "piscar" no tema errado)
  (function () {
    var raiz = document.documentElement;
    raiz.dataset.temaOriginal = raiz.getAttribute("data-theme") || "";
    try {
      var t = localStorage.getItem("simulado-bd-tema");
      if (t === "light" || t === "dark") raiz.setAttribute("data-theme", t);
    } catch (e) { /* navegador sem localStorage: segue o sistema */ }
  })();
</script>
<main class="app">
  <header class="topo">
    <div class="topo-linha">
      <span class="eyebrow">Revisão · Banco de Dados</span>
      <div class="tema-sel" role="group" aria-label="Aparência">
        <button type="button" data-modo="auto" aria-pressed="true" aria-label="Tema automático" title="Seguir o tema do sistema">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span class="rot">Auto</span>
        </button>
        <button type="button" data-modo="light" aria-pressed="false" aria-label="Tema claro" title="Tema claro">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="rot">Claro</span>
        </button>
        <button type="button" data-modo="dark" aria-pressed="false" aria-label="Tema escuro" title="Tema escuro">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg><span class="rot">Escuro</span>
        </button>
      </div>
    </div>
    <h1 class="titulo">Simulado MySQL e brModelo</h1>
    <p class="sub">10 questões sorteadas de <strong id="total-banco">175</strong>. Responda todas e finalize para ver a correção.</p>
    <div class="controles">
      <label class="visually-hidden" for="tema">Tema das questões</label>
      <select class="form-select" id="tema"></select>
      <button type="button" class="btn-sec btn-ico" id="nova" aria-label="Sortear nova prova">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg><span class="rot">Sortear</span>
      </button>
    </div>
    <details class="hist" id="hist">
      <summary>
        <span class="hist-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg></span>
        Seu histórico <span id="hist-cont"></span>
      </summary>
      <div class="hist-corpo" id="hist-corpo"></div>
    </details>
  </header>

  <section class="resumo" id="resumo" hidden aria-live="polite">
    <h2 id="res-titulo">Resultado</h2>
    <div class="anel" id="anel">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="trilho" cx="60" cy="60" r="52"/>
        <circle class="valor" id="anel-valor" cx="60" cy="60" r="52" stroke-dasharray="326.73" stroke-dashoffset="326.73"/>
      </svg>
      <div class="anel-centro"><span class="n" id="res-nota">0%</span><span class="l">aproveitamento</span></div>
    </div>
    <div class="placar">
      <span class="pilula p-ok"><span class="n" id="res-acertos">0</span> acertos</span>
      <span class="pilula p-bad"><span class="n" id="res-erros">0</span> erros</span>
    </div>
    <p class="res-msg" id="res-msg"></p>
    <p class="res-msg" id="res-temas"></p>
    <button type="button" class="btn-acc" id="nova-2">Fazer nova prova</button>
  </section>

  <div class="questoes" id="questoes"></div>
</main>

<div class="barra" role="region" aria-label="Progresso da prova">
  <div class="barra-in">
    <div class="prog">
      <div class="prog-txt" id="progresso-txt"><b>0/10</b> respondidas</div>
      <div class="segmentos" id="segmentos" aria-hidden="true"></div>
    </div>
    <button type="button" class="btn-sec" id="finalizar">Próxima</button>
  </div>
</div>
<!--CORPO-FIM-->
<!-- Ordem importa: imagens -> perguntas -> app -->
<script src="imagens.js"></script>
<script src="perguntas.js"></script>
<script src="app.js"></script>
</body>
</html>
